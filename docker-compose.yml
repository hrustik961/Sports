services:
  postgres-db:
    container_name: sport_events_db
    image: postgres:15-alpine
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=sport_events
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schemes/:/docker-entrypoint-initdb.d/

volumes:
  postgres-data:
